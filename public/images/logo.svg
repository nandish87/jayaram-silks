<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C15A" />
      <stop offset="50%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#8F6B12" />
    </linearGradient>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B1113" />
      <stop offset="100%" stop-color="#520A0C" />
    </linearGradient>
  </defs>

  <!-- Emblem / Shuttle & Kalash Motif -->
  <g transform="translate(15, 10)">
    <!-- Traditional Temple Arch / Shikhara Frame -->
    <path d="M 50 5 Q 75 30 75 60 Q 75 95 50 95 Q 25 95 25 60 Q 25 30 50 5 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
    
    <!-- Auspicious Kalash / Loom Shuttle in Center -->
    <path d="M 50 20 L 58 35 L 65 38 L 50 82 L 35 38 L 42 35 Z" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="1.5" />
    
    <!-- Peacock / Zari motif inside -->
    <circle cx="50" cy="46" r="5" fill="url(#goldGrad)" />
    <path d="M 50 51 C 45 60 55 68 50 75" stroke="url(#goldGrad)" stroke-width="2" fill="none" />
    
    <!-- Small Sun / Diya rays -->
    <circle cx="50" cy="12" r="3" fill="url(#goldGrad)" />
    <line x1="50" y1="4" x2="50" y2="8" stroke="url(#goldGrad)" stroke-width="2" />
    <line x1="43" y1="7" x2="46" y2="10" stroke="url(#goldGrad)" stroke-width="2" />
    <line x1="57" y1="7" x2="54" y2="10" stroke="url(#goldGrad)" stroke-width="2" />
    
    <!-- Subtle Loom threads -->
    <line x1="15" y1="50" x2="25" y2="50" stroke="url(#goldGrad)" stroke-width="1.5" />
    <line x1="75" y1="50" x2="85" y2="50" stroke="url(#goldGrad)" stroke-width="1.5" />
  </g>

  <!-- Typography -->
  <g transform="translate(125, 0)">
    <!-- Business Name Top Line -->
    <text x="0" y="48" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="800" fill="#7B1113" letter-spacing="1.5">
      Y. JAYARAM
    </text>
    
    <!-- Silk Sarees Highlight Line -->
    <text x="0" y="78" font-family="'Playfair Display', Georgia, serif" font-size="21" font-weight="600" fill="#C59B27" letter-spacing="4">
      SILK SAREES
    </text>
    
    <!-- Subtitle / Heritage Line -->
    <text x="2" y="98" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="500" fill="#0F5132" letter-spacing="2">
      PURE HAND LOOM WEAVERS • MADANAPALLE
    </text>
    
    <!-- Traditional Zari accent line -->
    <line x1="2" y1="84" x2="350" y2="84" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="4, 3" />
  </g>
</svg>
